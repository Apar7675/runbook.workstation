name: Manual Workstation validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile internal diagnostic paths without starting runtime
        run: dotnet build src/RunBook.Workstation/RunBook.Workstation.csproj --configuration Debug
      - name: Build Workstation without starting runtime
        run: dotnet build src/RunBook.Workstation/RunBook.Workstation.csproj --configuration Release
      - name: Verify isolated actor-bound outbox and durable publication
        run: dotnet run --project tests/OutboxRegressionTests/OutboxRegressionTests.csproj --configuration Release
      - name: Verify configured Service routes and credential boundaries
        run: dotnet run --project tests/EndpointRegressionTests/EndpointRegressionTests.csproj --configuration Release
